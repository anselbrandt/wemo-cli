<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lights</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #fbfbfa;
        --card: #fff;
        --line: #e2e2df;
        --muted: #6b6b68;
        --accent: #2f6f4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececea;
          --bg: #191918;
          --card: #232322;
          --line: #37372f;
          --muted: #9c9c97;
          --accent: #7dc79c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1rem 3rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 26rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p.hint {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.875rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 3.25rem 1fr 1fr;
        gap: 0.5rem;
        align-items: center;
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row.head {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .day {
        font-weight: 600;
      }
      input[type="time"] {
        width: 100%;
        padding: 0.4rem 0.5rem;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 0.4rem;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-top: 1.25rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.4rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.secondary {
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
      }
      .now {
        display: flex;
        gap: 0.6rem;
        margin: 0 0 1.5rem;
      }
      .now button {
        flex: 1;
      }
      .status {
        font-size: 0.875rem;
        color: var(--muted);
        min-height: 1.5rem;
      }
      .status.error {
        color: #c2402a;
      }
      h2 {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lights</h1>

      <h2>Right now</h2>
      <div class="now">
        <button id="lights-on" class="secondary">Lights on</button>
        <button id="lights-out" class="secondary">Lights out</button>
      </div>
      <p class="status" id="now-status"></p>

      <h2>Schedule</h2>
      <p class="hint">
        Times are the local clock time on that calendar day. Leave a field blank
        for no change that day. To stay up late Friday, set Saturday&rsquo;s
        off time to e.g. 01:00.
      </p>

      <div class="card" id="rows">
        <div class="row head">
          <span>Day</span><span>On</span><span>Off</span>
        </div>
      </div>

      <div class="actions">
        <button id="save" disabled>Save</button>
        <span class="status" id="status">Loading&hellip;</span>
      </div>
    </main>

    <script>
      const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const rows = document.getElementById("rows");
      const saveButton = document.getElementById("save");
      const status = document.getElementById("status");
      const nowStatus = document.getElementById("now-status");
      const onButton = document.getElementById("lights-on");
      const outButton = document.getElementById("lights-out");
      const inputs = {};

      for (const day of DAYS) {
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("span");
        label.className = "day";
        label.textContent = day;
        row.append(label);
        inputs[day] = {};
        for (const action of ["on", "off"]) {
          const input = document.createElement("input");
          input.type = "time";
          input.setAttribute("aria-label", day + " " + action);
          inputs[day][action] = input;
          row.append(input);
        }
        rows.append(row);
      }

      function setStatus(element, message, isError) {
        element.textContent = message;
        element.className = isError ? "status error" : "status";
      }

      async function load() {
        try {
          const response = await fetch("/schedule");
          if (!response.ok) throw new Error("HTTP " + response.status);
          const schedule = await response.json();
          for (const day of DAYS) {
            for (const action of ["on", "off"]) {
              inputs[day][action].value = (schedule[day] || {})[action] || "";
            }
          }
          saveButton.disabled = false;
          setStatus(status, "");
        } catch (error) {
          setStatus(status, "Could not load schedule: " + error.message, true);
        }
      }

      async function save() {
        const body = {};
        for (const day of DAYS) {
          body[day] = {
            on: inputs[day].on.value || null,
            off: inputs[day].off.value || null,
          };
        }
        saveButton.disabled = true;
        setStatus(status, "Saving…");
        try {
          const response = await fetch("/schedule", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.message || "HTTP " + response.status);
          setStatus(status, "Saved");
        } catch (error) {
          setStatus(status, "Save failed: " + error.message, true);
        } finally {
          saveButton.disabled = false;
        }
      }

      // /on and /off answer immediately and then drive the switches in the
      // background (a full sweep is paced, so it takes up to a minute). There's
      // nothing to await, so report "sent" rather than pretending it's done.
      async function switchAll(action, label) {
        onButton.disabled = true;
        outButton.disabled = true;
        setStatus(nowStatus, label + "…");
        try {
          const response = await fetch("/" + action);
          if (!response.ok) throw new Error("HTTP " + response.status);
          setStatus(nowStatus, label + " — sent, switches follow within a minute");
        } catch (error) {
          setStatus(nowStatus, label + " failed: " + error.message, true);
        } finally {
          onButton.disabled = false;
          outButton.disabled = false;
        }
      }

      saveButton.addEventListener("click", save);
      onButton.addEventListener("click", () => switchAll("on", "Lights on"));
      outButton.addEventListener("click", () => switchAll("off", "Lights out"));
      load();
    </script>
  </body>
</html>
